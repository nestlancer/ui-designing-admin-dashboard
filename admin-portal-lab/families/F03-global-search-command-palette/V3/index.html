<script>(()=>{try{const q=new URLSearchParams(location.search).get('theme'),t=q||localStorage.getItem('nl-admin-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}})();</script>

<style>
body{min-height:100vh;background:var(--background);color:var(--foreground);font-family:var(--font)}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--card)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.brand svg{width:28px;height:28px}
#open{margin-left:auto;min-height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--muted);cursor:pointer;font-size:13px}
.stage{padding:28px 20px;max-width:900px}.stage h1{margin:0 0 8px;font-size:34px}.stage p{color:var(--muted-foreground);line-height:1.55;font-size:14px}
.lab-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:12px}
.backdrop{position:fixed;inset:0;background:rgba(26,36,51,.45);display:grid;place-items:start center;padding:9vh 12px;z-index:40}
.palette{width:min(860px,100%);max-height:min(78vh,680px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.head{padding:12px 14px;border-bottom:1px solid var(--border)}
.head h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-foreground)}
#q{width:100%;min-height:44px;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 12px;background:var(--background);color:var(--foreground);font-size:15px}
.body{display:grid;grid-template-columns:1.1fr .9fr;min-height:0;flex:1;overflow:hidden}
.list{overflow:auto;padding:8px;border-right:1px solid var(--border)}
.item{display:block;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:var(--radius-md);background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit}
.item[aria-selected="true"],.item:hover{background:var(--primary-tint)}
.gl{margin:8px 8px 4px;font-size:11px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--sidebar-section)}
.lbl{font-size:14px;font-weight:650}.sub{display:block;font-size:12px;color:var(--muted-foreground);margin-top:2px}
.preview{padding:16px;overflow:auto;background:var(--muted)}
.preview h3{margin:0 0 8px;font-size:18px}.preview .route{font:650 12px var(--mono);color:var(--brand-700);margin-bottom:10px}
.preview dl{margin:0;display:grid;gap:8px;font-size:13px}.preview dt{color:var(--muted-foreground);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}.preview dd{margin:0}
.badge{display:inline-flex;padding:2px 7px;border-radius:999px;border:1px solid var(--status-success-border);background:var(--status-success-bg);color:var(--status-success-text);font-size:11px;font-weight:650}
.foot{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground)}.foot b{font-family:var(--mono);color:var(--foreground)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);font-size:13px;max-width:92vw}
.empty{padding:24px;color:var(--muted-foreground);text-align:center}
@media(max-width:760px){.body{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid var(--border);max-height:42vh}.backdrop{padding:0;align-items:end}.palette{max-height:94vh;border-radius:var(--radius-xl) var(--radius-xl) 0 0}}
@media(prefers-reduced-motion:reduce){.preview{transition:none}}
.preview{transition:opacity var(--duration-fast)}
</style>
</head>
<body>

<header class="top"><div class="brand"><svg viewBox="0 0 40 40" role="img" aria-labelledby="lt"><title id="lt">Nestlancer Admin</title><path d="M20 2 35 10.5v19L20 38 5 29.5v-19Z" fill="#0c7963"/><path d="M12 28V12l16 16V12" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Nestlancer Admin</div>
<button id="open" type="button">Search pages… ⌘K</button>
<button class="icon-button theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.9 12.5A9 9 0 1 1 11.5 3.1a7 7 0 0 0 9.4 9.4Z"/></svg></button></header>
<main id="main-content" class="stage" tabindex="-1"><span class="meta">F03 · V3 · PREVIEW</span><h1>Command menu</h1><p>Split results and preview. The highlighted row shows route, API mapping, and why the jump exists — without inventing endpoints.</p>
<nav class="lab-nav"><a href="../V1/index.html">V1</a><a href="../V2/index.html">V2</a><a href="./index.html" aria-current="page">V3</a><a href="../V4/index.html">V4</a><a href="../V5/index.html">V5</a><a href="../../../index.html#f03">Gallery</a></nav></main>
<div class="backdrop" id="backdrop" hidden>
<div class="palette" role="dialog" aria-modal="true" aria-labelledby="pt" id="command-menu">
<div class="head"><h2 id="pt">Command menu</h2><input id="q" type="search" placeholder="Search or jump to…" aria-label="Command search" role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list" aria-activedescendant=""></div>
<div class="body"><div class="list" id="results" role="listbox" aria-label="Command results"></div>
<aside class="preview" id="preview" aria-live="polite"><h3>Select a result</h3><p class="route">Preview appears here</p></aside></div>
<div class="foot"><span><b>↑↓</b> navigate</span><span><b>↵</b> select</span><span><b>esc</b> close</span></div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(()=>{
const C=[
{g:'Queues',id:'q1',label:'Requests · pending',why:'Operator queue jump',route:'/requests',api:'GET /api/v1/admin/requests',badge:'11'},
{g:'Queues',id:'q2',label:'Inquiries · new',why:'Contact triage',route:'/contact',api:'GET /api/v1/admin/contact',badge:'17'},
{g:'Queues',id:'q3',label:'Payments · awaiting verification',why:'Money ops',route:'/payments?view=verification',api:'GET /api/v1/admin/payments',badge:'16'},
{g:'Queues',id:'q4',label:'Payments · disputes',why:'Approval path',route:'/payments/disputes',api:'GET /api/v1/admin/payments/disputes'},
{g:'People',id:'p1',label:'Riya Kapoor',why:'Jump-to-user demo',route:'/users/demo-riya',api:'GET /api/v1/admin/users/search'},
{g:'People',id:'p2',label:'Patel Digital Agency',why:'Jump-to-user demo',route:'/users/demo-patel',api:'GET /api/v1/admin/users/search'},
{g:'Operations',id:'o1',label:'Dashboard',why:'Captured page',route:'/dashboard',api:'GET /api/dashboard/overview'},
{g:'Operations',id:'o2',label:'Pipelines',why:'Captured page',route:'/pipeline',api:'—'},
{g:'Operations',id:'o3',label:'Pipeline · User hub',why:'Captured page',route:'/pipeline/users',api:'—'},
{g:'Operations',id:'o4',label:'Pipeline · Project hub',why:'Captured page',route:'/pipeline/projects',api:'—'},
{g:'Operations',id:'o5',label:'Inquiries',why:'Captured page',route:'/contact',api:'GET /api/v1/admin/contact'},
{g:'Operations',id:'o6',label:'Requests',why:'Captured page',route:'/requests',api:'GET /api/v1/admin/requests'},
{g:'Operations',id:'o7',label:'Quotes',why:'Captured page',route:'/quotes',api:'GET /api/v1/admin/quotes'},
{g:'Operations',id:'o8',label:'Projects',why:'Captured page',route:'/projects',api:'GET /api/v1/admin/projects'},
{g:'Operations',id:'o9',label:'Users',why:'Captured page',route:'/users',api:'GET /api/v1/admin/users'},
{g:'Operations',id:'o10',label:'Payments',why:'Captured page',route:'/payments',api:'GET /api/v1/admin/payments'},
{g:'Operations',id:'o11',label:'Settlement accounts',why:'Captured page',route:'/payments/accounts',api:'GET /api/v1/admin/payments/accounts'},
{g:'Operations',id:'o12',label:'Company legal identity',why:'Captured page',route:'/company-legal',api:'GET /api/v1/admin/payments/company-legal'},
{g:'Operations',id:'o13',label:'Messages',why:'Captured page',route:'/messages',api:'—'},
{g:'Operations',id:'o14',label:'Moderation',why:'Captured page',route:'/moderation',api:'—'},
{g:'Operations',id:'o15',label:'Analytics',why:'Captured page',route:'/analytics',api:'—'},
{g:'Records',id:'x1',label:'Request 01a10a2b…dd22',why:'Mono ID jump',route:'/requests/01a10a2b-c237-7000-b708-715e75b6dd22',api:'GET /api/v1/admin/requests/{id}',meta:'01a10a2b…'},
{g:'Content',id:'c1',label:'Blog',why:'Captured page',route:'/content',api:'—'},
{g:'Content',id:'c2',label:'Portfolio',why:'Captured page',route:'/portfolio',api:'—'},
{g:'Content',id:'c3',label:'Media Library',why:'Captured page',route:'/media',api:'—'},
{g:'System',id:'s1',label:'System Config',why:'Captured page',route:'/system',api:'GET /api/system/config'},
{g:'System',id:'s2',label:'Webhooks',why:'Captured page',route:'/integrations',api:'GET /api/webhooks'},
{g:'System',id:'s3',label:'Audit Logs',why:'Captured page',route:'/audit',api:'GET /api/audit/logs'},
{g:'Quick actions',id:'a1',label:'Create blog post',why:'Captured action',route:'/content/posts/new',api:'blog'},
{g:'Quick actions',id:'a2',label:'New portfolio item',why:'Captured action',route:'/portfolio/new',api:'portfolio'},
{g:'Quick actions',id:'a3',label:'Message client',why:'Captured action',route:'/messages/new',api:'messaging'},
{g:'Quick actions',id:'a4',label:'New group chat',why:'Demo if destination 404',route:'/messages/new-group',api:'messaging',demo:true},
{g:'Quick actions',id:'a5',label:'Switch to dark mode',why:'Local theme',route:'local:theme',api:'—',local:true}
];
let active=0,visible=[],open=false,lastFocus=null;
const $=id=>document.getElementById(id);
const backdrop=$('backdrop'),q=$('q'),results=$('results'),preview=$('preview'),toast=$('toast');
function announce(m){toast.hidden=false;toast.textContent=m;clearTimeout(announce.t);announce.t=setTimeout(()=>toast.hidden=true,3000)}
function filt(){const s=q.value.trim().toLowerCase();if(!s)return C.slice();return C.filter(i=>[i.label,i.g,i.route,i.api,i.why].join(' ').toLowerCase().includes(s))}
function showPreview(item){if(!item){preview.innerHTML='<h3>No selection</h3>';return}preview.style.opacity='.55';requestAnimationFrame(()=>{preview.innerHTML=`<h3>${item.label}</h3><div class="route">${item.route}</div><dl><div><dt>Why</dt><dd>${item.why}</dd></div><div><dt>API</dt><dd><span class="meta" style="font-family:var(--mono)">${item.api}</span></dd></div><div><dt>Group</dt><dd>${item.g}${item.badge?` · <span class="badge">${item.badge}</span>`:''}</dd></div>${item.demo?'<div><dt>Note</dt><dd>Demo-labelled destination</dd></div>':''}</dl>`;preview.style.opacity='1'})}
function render(){visible=filt();results.innerHTML='';if(!visible.length){results.innerHTML='<div class="empty">No matches for this query.</div>';preview.innerHTML='<h3>No matches</h3>';q.setAttribute('aria-activedescendant','');return}if(active>=visible.length)active=visible.length-1;let last='';visible.forEach((item,i)=>{if(item.g!==last){const d=document.createElement('div');d.className='gl';d.textContent=item.g;results.appendChild(d);last=item.g}const b=document.createElement('button');b.type='button';b.className='item';b.id='opt-'+item.id;b.role='option';b.setAttribute('aria-selected',String(i===active));b.innerHTML=`<span class="lbl">${item.label}</span><span class="sub">${item.route}</span>`;b.onmouseenter=()=>{active=i;render()};b.onclick=()=>select(item);results.appendChild(b)});q.setAttribute('aria-activedescendant','opt-'+visible[active].id);showPreview(visible[active]);const el=document.getElementById('opt-'+visible[active].id);if(el)el.scrollIntoView({block:'nearest'})}
function select(item){if(!item)return;if(item.local){document.documentElement.classList.toggle('dark');sync();announce('Theme toggled locally (demo).');return}announce(`Demo only — would navigate to ${item.route}`)}
function openP(){if(open)return;open=true;lastFocus=document.activeElement;backdrop.hidden=false;q.value='';active=0;render();setTimeout(()=>q.focus(),10)}
function closeP(){if(!open)return;open=false;backdrop.hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function sync(){const d=document.documentElement.classList.contains('dark');const b=document.querySelector('.theme-toggle');b.setAttribute('aria-pressed',String(d));b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');try{localStorage.setItem('nl-admin-theme',d?'dark':'light')}catch(e){}}
$('open').onclick=openP;document.querySelector('.theme-toggle').onclick=()=>{document.documentElement.classList.toggle('dark');sync()};sync();
backdrop.onmousedown=e=>{if(e.target===backdrop)closeP()};q.oninput=()=>{active=0;render()};
document.onkeydown=e=>{const mod=e.metaKey||e.ctrlKey;if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();open?closeP():openP();return}if(!open)return;if(e.key==='Escape'){e.preventDefault();closeP();return}if(e.key==='ArrowDown'){e.preventDefault();active=Math.min(active+1,visible.length-1);render();return}if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0);render();return}if(e.key==='Enter'){e.preventDefault();select(visible[active])}};
openP();
})();
</script>
</body>

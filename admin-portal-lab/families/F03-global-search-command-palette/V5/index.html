<script>(()=>{try{const q=new URLSearchParams(location.search).get('theme'),t=q||localStorage.getItem('nl-admin-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}})();</script>
<link rel="stylesheet" href="../../../shared/tokens.css"><link rel="stylesheet" href="../../../shared/base.css"><link rel="stylesheet" href="../../../shared/console-shell.css">
<style>
body{min-height:100vh;background:var(--background);color:var(--foreground);font-family:var(--font)}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--card)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.brand svg{width:28px;height:28px}
#open{margin-left:auto;min-height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--muted);cursor:pointer;font-size:13px}
.stage{padding:28px 20px;max-width:900px}.stage h1{margin:0 0 8px;font-size:34px}.stage p{color:var(--muted-foreground);font-size:14px;line-height:1.55}
.lab-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:12px}
.backdrop{position:fixed;inset:0;background:rgba(26,36,51,.45);display:grid;place-items:start center;padding:9vh 12px;z-index:40}
.palette{width:min(820px,100%);max-height:min(78vh,680px);display:grid;grid-template-columns:168px 1fr;grid-template-rows:auto 1fr auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.head{grid-column:1/-1;padding:12px 14px;border-bottom:1px solid var(--border)}
.head h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-foreground)}
#q{width:100%;min-height:44px;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 12px;background:var(--background);color:var(--foreground);font-size:15px}
.rail{border-right:1px solid var(--border);padding:10px 8px;background:var(--muted);overflow:auto}
.rail button{display:block;width:100%;min-height:36px;margin-bottom:4px;padding:6px 8px;border:0;border-radius:var(--radius-md);background:transparent;text-align:left;cursor:pointer;color:var(--muted-foreground);font:650 12px var(--font)}
.rail button[aria-current="true"]{background:var(--card);color:var(--brand-800);box-shadow:var(--shadow-xs)}
.list{overflow:auto;padding:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:var(--radius-md);background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit;opacity:0;transform:translateY(4px);animation:in var(--duration-normal) var(--ease-spring) forwards}
.item[aria-selected="true"],.item:hover{background:var(--primary-tint)}
.item:nth-child(1){animation-delay:20ms}.item:nth-child(2){animation-delay:40ms}.item:nth-child(3){animation-delay:60ms}.item:nth-child(4){animation-delay:80ms}.item:nth-child(5){animation-delay:100ms}.item:nth-child(6){animation-delay:120ms}.item:nth-child(n+7){animation-delay:140ms}
@keyframes in{to{opacity:1;transform:none}}
.lbl{font-size:14px;font-weight:650}.sub{display:block;font-size:12px;color:var(--muted-foreground);margin-top:2px}
.meta{font:650 11px var(--mono);color:var(--muted-foreground)}.badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--status-warning-border);background:var(--status-warning-bg);color:var(--status-warning-text);font-weight:650}
.foot{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground)}.foot b{font-family:var(--mono);color:var(--foreground)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);font-size:13px;max-width:92vw}
.empty{padding:24px;text-align:center;color:var(--muted-foreground)}
@media(max-width:720px){.palette{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}.rail{display:flex;gap:4px;border-right:0;border-bottom:1px solid var(--border);overflow:auto}.rail button{width:auto;white-space:nowrap;margin:0}.backdrop{padding:0;align-items:end}.palette{max-height:94vh;border-radius:var(--radius-xl) var(--radius-xl) 0 0}}
@media(prefers-reduced-motion:reduce){.item{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>

<header class="top"><div class="brand"><svg viewBox="0 0 40 40" role="img" aria-labelledby="lt"><title id="lt">Nestlancer Admin</title><path d="M20 2 35 10.5v19L20 38 5 29.5v-19Z" fill="#0c7963"/><path d="M12 28V12l16 16V12" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Nestlancer Admin</div>
<button id="open" type="button">Search pages… ⌘K</button>
<button class="icon-button theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.9 12.5A9 9 0 1 1 11.5 3.1a7 7 0 0 0 9.4 9.4Z"/></svg></button></header>
<main id="main-content" class="stage" tabindex="-1"><span class="meta">F03 · V5 · MOTION</span><h1>Command menu</h1><p>Chapter rail stages Operations → Queues → People → Content → System → Actions. Reduced motion disables stagger; keyboard remains complete.</p>

<div class="backdrop" id="backdrop" hidden>
<div class="palette" role="dialog" aria-modal="true" aria-labelledby="pt" id="command-menu">
<div class="head"><h2 id="pt">Command menu</h2><input id="q" type="search" placeholder="Search or jump to…" aria-label="Command search" role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list" aria-activedescendant=""></div>
<nav class="rail" aria-label="Command chapters" id="rail"></nav>
<div class="list" id="results" role="listbox" aria-label="Command results"></div>
<div class="foot"><span><b>↑↓</b> navigate</span><span><b>↵</b> select</span><span><b>[ ]</b> chapters</span><span><b>esc</b> close</span></div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(()=>{
const CHAPTERS=['Operations','Queues','People','Content','System','Quick actions'];
const C=[
{g:'Operations',id:'o1',label:'Dashboard',route:'/dashboard'},{g:'Operations',id:'o2',label:'Pipelines',route:'/pipeline'},{g:'Operations',id:'o3',label:'Pipeline · User hub',route:'/pipeline/users'},{g:'Operations',id:'o4',label:'Pipeline · Project hub',route:'/pipeline/projects'},{g:'Operations',id:'o5',label:'Inquiries',route:'/contact'},{g:'Operations',id:'o6',label:'Requests',route:'/requests'},{g:'Operations',id:'o7',label:'Quotes',route:'/quotes'},{g:'Operations',id:'o8',label:'Projects',route:'/projects'},{g:'Operations',id:'o9',label:'Users',route:'/users'},{g:'Operations',id:'o10',label:'Payments',route:'/payments'},{g:'Operations',id:'o11',label:'Settlement accounts',route:'/payments/accounts'},{g:'Operations',id:'o12',label:'Company legal identity',route:'/company-legal'},{g:'Operations',id:'o13',label:'Messages',route:'/messages'},{g:'Operations',id:'o14',label:'Moderation',route:'/moderation'},{g:'Operations',id:'o15',label:'Analytics',route:'/analytics'},
{g:'Queues',id:'q1',label:'Requests · pending',route:'/requests',badge:'11'},{g:'Queues',id:'q2',label:'Inquiries · new',route:'/contact',badge:'17'},{g:'Queues',id:'q3',label:'Payments · awaiting verification',route:'/payments?view=verification',badge:'16'},{g:'Queues',id:'q4',label:'Payments · disputes',route:'/payments/disputes'},{g:'Queues',id:'q5',label:'Request 01a10a2b…dd22',route:'/requests/01a10a2b-c237-7000-b708-715e75b6dd22',meta:'01a10a2b…'},
{g:'People',id:'p1',label:'Riya Kapoor',route:'/users/demo-riya',meta:'demo'},{g:'People',id:'p2',label:'Patel Digital Agency',route:'/users/demo-patel',meta:'demo'},
{g:'Content',id:'c1',label:'Blog',route:'/content'},{g:'Content',id:'c2',label:'Portfolio',route:'/portfolio'},{g:'Content',id:'c3',label:'Media Library',route:'/media'},
{g:'System',id:'s1',label:'System Config',route:'/system'},{g:'System',id:'s2',label:'Webhooks',route:'/integrations'},{g:'System',id:'s3',label:'Audit Logs',route:'/audit'},
{g:'Quick actions',id:'a1',label:'Create blog post',route:'/content/posts/new'},{g:'Quick actions',id:'a2',label:'New portfolio item',route:'/portfolio/new'},{g:'Quick actions',id:'a3',label:'Message client',route:'/messages/new'},{g:'Quick actions',id:'a4',label:'New group chat',route:'/messages/new-group'},{g:'Quick actions',id:'a5',label:'Switch to dark mode',route:'local:theme',local:true}
];
let chapter='Operations',active=0,visible=[],open=false,lastFocus=null;
const $=id=>document.getElementById(id);
const backdrop=$('backdrop'),q=$('q'),results=$('results'),rail=$('rail'),toast=$('toast');
function announce(m){toast.hidden=false;toast.textContent=m;clearTimeout(announce.t);announce.t=setTimeout(()=>toast.hidden=true,3000)}
function buildRail(){rail.innerHTML='';CHAPTERS.forEach(ch=>{const b=document.createElement('button');b.type='button';b.textContent=ch;b.setAttribute('aria-current',String(ch===chapter));b.onclick=()=>{chapter=ch;active=0;q.value='';render()};rail.appendChild(b)})}
function pool(){const s=q.value.trim().toLowerCase();if(s)return C.filter(i=>[i.label,i.g,i.route,i.meta].filter(Boolean).join(' ').toLowerCase().includes(s));return C.filter(i=>i.g===chapter)}
function render(){buildRail();visible=pool();results.innerHTML='';if(!visible.length){results.innerHTML='<div class="empty">No matches in this chapter.</div>';q.setAttribute('aria-activedescendant','');return}if(active>=visible.length)active=visible.length-1;visible.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.className='item';b.id='opt-'+item.id;b.role='option';b.setAttribute('aria-selected',String(i===active));b.innerHTML=`<span><span class="lbl">${item.label}</span><span class="sub">${item.route}</span></span><span>${item.badge?`<span class="badge">${item.badge}</span>`:`<span class="meta">${item.meta||''}</span>`}</span>`;b.onmouseenter=()=>{active=i;render()};b.onclick=()=>select(item);results.appendChild(b)});q.setAttribute('aria-activedescendant','opt-'+visible[active].id);const el=document.getElementById('opt-'+visible[active].id);if(el)el.scrollIntoView({block:'nearest'})}
function select(item){if(!item)return;if(item.local){document.documentElement.classList.toggle('dark');sync();announce('Theme toggled locally (demo).');return}announce('Demo only — would navigate to '+item.route)}
function openP(){if(open)return;open=true;lastFocus=document.activeElement;backdrop.hidden=false;q.value='';chapter='Operations';active=0;render();setTimeout(()=>q.focus(),10)}
function closeP(){if(!open)return;open=false;backdrop.hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function sync(){const d=document.documentElement.classList.contains('dark');const b=document.querySelector('.theme-toggle');b.setAttribute('aria-pressed',String(d));b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');try{localStorage.setItem('nl-admin-theme',d?'dark':'light')}catch(e){}}
$('open').onclick=openP;document.querySelector('.theme-toggle').onclick=()=>{document.documentElement.classList.toggle('dark');sync()};sync();
backdrop.onmousedown=e=>{if(e.target===backdrop)closeP()};q.oninput=()=>{active=0;render()};
document.onkeydown=e=>{const mod=e.metaKey||e.ctrlKey;if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();open?closeP():openP();return}if(!open)return;if(e.key==='Escape'){e.preventDefault();closeP();return}if(e.key==='ArrowDown'){e.preventDefault();active=Math.min(active+1,visible.length-1);render();return}if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0);render();return}if(e.key==='Enter'){e.preventDefault();select(visible[active]);return}if(e.key==='['||e.key===']'){e.preventDefault();const i=CHAPTERS.indexOf(chapter);chapter=CHAPTERS[(i+(e.key===']'?1:-1)+CHAPTERS.length)%CHAPTERS.length];active=0;q.value='';render()}};
openP();
})();
</script>

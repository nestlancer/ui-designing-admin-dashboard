body{min-height:100vh;background:var(--background);color:var(--foreground);font-family:var(--font)}.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--card)}.brand{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}.brand svg{width:28px;height:28px}.main{padding:18px;max-width:1180px;margin:0 auto}h1{margin:4px 0 6px;font-size:30px}.lede{margin:0 0 12px;color:var(--muted-foreground);font-size:14px;line-height:1.5}.mono{font-family:var(--mono);font-size:11px;color:var(--muted-foreground)}.lab-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:12px}.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);font-size:13px;display:none}.toast.show{display:block}.chip,.view,.tab{min-height:30px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--muted);font:650 12px var(--font);cursor:pointer;color:inherit;margin:0 4px 4px 0}.chip[aria-pressed="true"],.view[aria-pressed="true"],.tab[aria-selected="true"]{background:var(--primary-tint);border-color:var(--brand-200);color:var(--brand-800)}.bulk{display:none;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);margin:8px 0}.bulk.show{display:flex}.age,.tag{display:inline-flex;padding:2px 6px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid var(--status-warning-border);background:var(--status-warning-bg);color:var(--status-warning-text)}.tag{border-color:var(--status-info-border);background:var(--status-info-bg);color:var(--status-info-text)}.kpi{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);min-width:90px;display:inline-block;margin:0 8px 8px 0}.kpi b{display:block;font:800 24px/1 var(--font);font-variant-numeric:tabular-nums}.kpi span{font-size:11px;color:var(--muted-foreground)}.composer input,.composer textarea,.composer select,input,textarea,select{min-height:36px;padding:8px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--background);color:var(--foreground);font:inherit;width:100%;max-width:480px}.composer textarea{min-height:80px}.modal{position:fixed;inset:0;background:rgba(26,36,51,.45);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal .box{width:min(440px,100%);padding:16px;border-radius:var(--radius-lg);background:var(--card);border:1px solid var(--border)}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.layout{display:grid;grid-template-columns:280px 1fr;gap:12px;min-height:60vh}.side,.pane{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);padding:10px;overflow:auto}.side h2{margin:0 0 8px;font-size:14px}.log tr:hover{background:var(--primary-tint)}.composer{display:grid;gap:6px;font-size:12px}.composer label{font-size:11px;color:var(--muted-foreground)}@media(max-width:900px){.layout{grid-template-columns:1fr}}

<h1>Notifications ops</h1>
<p class="lede">Log-led broadcast control with delivery telemetry — inbox in the side rail.</p>
<div class="layout">
<aside class="side"><h2>Inbox · 535 unread</h2>
<div id="views"></div><div id="chips"></div>
<div class="bulk" id="bulk"><span id="bulk-count">0</span><button class="button button-secondary" data-bulk="read">Mark read</button></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="confirm" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><h3 id="confirm-title">Confirm</h3><p id="confirm-body"></p><div style="display:flex;gap:8px;margin-top:12px"><button type="button" class="button" id="confirm-go">Confirm</button><button type="button" class="button button-secondary" id="confirm-cancel">Cancel</button></div></div></div>
<script>(()=>{const b=document.querySelector('.theme-toggle'),r=document.documentElement,s=()=>{const d=r.classList.contains('dark');b.setAttribute('aria-pressed',String(d));b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode')};s();b.onclick=()=>{r.classList.toggle('dark');try{localStorage.setItem('nl-admin-theme',r.classList.contains('dark')?'dark':'light')}catch(e){}s()}})();</script>
<script>
const toast=document.getElementById('toast');function announce(m){toast.className='toast show';toast.textContent=m;clearTimeout(announce.t);announce.t=setTimeout(()=>toast.className='toast',2600)}

const NOTIFS=[{id:'n1',title:'Your data export is ready',body:'Your requested data export is ready to download.',cat:'Account',age:'21d',unread:true},{id:'n2',title:'Revenue export is ready',body:'Your requested export is ready to download.',cat:'Account',age:'23d',unread:true},{id:'n3',title:'New contact inquiry',body:'A new contact form submission was received.',cat:'Account',age:'23d',unread:true},{id:'n4',title:'New request submitted',body:'Arjun Mehta submitted AUDIT-A03…',cat:'Requests',age:'24d',unread:true},{id:'n5',title:'Quote accepted',body:'Arjun Mehta accepted a quote.',cat:'Quotes',age:'24d',unread:false},{id:'n6',title:'Quote expiring soon',body:'Expires within 24 hours.',cat:'Quotes',age:'12d',unread:true},{id:'n7',title:'Payment received',body:'Installment verified.',cat:'Payments',age:'5d',unread:true},{id:'n8',title:'New message',body:'Riya replied.',cat:'Messages',age:'2d',unread:true},{id:'n9',title:'Project milestone due',body:'Review tomorrow.',cat:'Projects',age:'1d',unread:true}];
const FILTERS=['All','Unread','Quotes','Payments','Messages','Projects','Requests','Account'];
const LOG=[{title:'Quote expiring soon',to:'arjun.mehta@nestlancer.com',sent:'12d',read:'Yes'},{title:'Your data export is ready',to:'admin@nestlancer.com',sent:'21d',read:'No'},{title:'New contact inquiry',to:'admin@nestlancer.com',sent:'23d',read:'Yes'},{title:'New request submitted',to:'admin@nestlancer.com',sent:'24d',read:'Yes'}];
let filter='All',view='all',focus=0,selected=new Set(),opsTab='send';
function pool(){let r=NOTIFS.slice();if(filter==='Unread')r=r.filter(x=>x.unread);else if(filter!=='All')r=r.filter(x=>x.cat===filter);if(view==='unread-mine')r=r.filter(x=>x.unread);if(view==='failures')r=r.filter(x=>x.title.includes('export'));if(view==='mentions')r=r.filter(x=>x.cat==='Messages'||x.cat==='Requests');return r}
function openConfirm(kind,title){const d=document.getElementById('confirm');d.hidden=false;d.classList.add('open');document.getElementById('confirm-title').textContent=kind==='broadcast'?'Confirm broadcast to all users':'Confirm send';document.getElementById('confirm-body').textContent=(kind==='broadcast'?'This will notify EVERY client inbox. ':'')+'Title: "'+(title||'(empty)')+'". Audited. Demo only — never calls live API.';document.getElementById('confirm-go').onclick=()=>{d.hidden=true;d.classList.remove('open');announce(kind+' receipt · demo')};document.getElementById('confirm-cancel').onclick=()=>{d.hidden=true;d.classList.remove('open')}}
function opsHTML(){if(opsTab==='send')return `<h3>Send to user</h3><div class="composer"><input id="t" placeholder="e.g. Quote ready for review"><textarea id="m" placeholder="Short message shown in the user's notification inbox"></textarea><button class="button" id="go">Send notification…</button></div>`;if(opsTab==='broadcast')return `<h3>Broadcast to all users</h3><p class="mono">Safety-critical · confirm required</p><div class="composer"><input id="t" placeholder="e.g. Scheduled maintenance tonight"><textarea id="m" placeholder="Short message shown in every user’s inbox"></textarea><button class="button" id="go">Broadcast to all users…</button></div>`;if(opsTab==='segment')return `<h3>Send to segment</h3><div class="composer"><select id="seg"><option>Clients only</option><option>Admins only</option></select><input id="t" placeholder="e.g. Quote ready for review"><textarea id="m"></textarea><button class="button" id="go">Send to clients only…</button></div>`;if(opsTab==='delivery')return `<h3>Delivery report</h3><select><option>Choose a recent notification…</option><option>Quote expiring soon · 01a1507d…28f1</option></select><button class="button button-secondary" style="margin-top:8px" onclick="announce('Delivery report loaded (demo)')">Load report</button>`;return `<h3>Platform log</h3><p class="mono">Page 1 of 24 · 580 total</p><table style="width:100%;font-size:12px;border-collapse:collapse">${LOG.map(l=>`<tr style="border-bottom:1px solid var(--border)"><td>${l.title}</td><td class="mono">${l.to}</td><td class="mono">${l.sent}</td><td>${l.read}</td></tr>`).join('')}</table>`}

opsTab='log';
function render(){
  document.getElementById('chips').innerHTML=FILTERS.map(f=>`<button class="chip" data-f="${f}" aria-pressed="${f===filter}">${f}</button>`).join('');
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  document.getElementById('views').innerHTML=[['all','All'],['unread-mine','Unread-mine'],['failures','Failures'],['mentions','Mentions']].map(([id,l])=>`<button class="view" data-v="${id}" aria-pressed="${id===view}">${l}</button>`).join('');
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  const rows=pool();
  document.getElementById('list').innerHTML=rows.map((r,i)=>`<div class="mono" style="padding:6px;border-bottom:1px solid var(--border);cursor:pointer;background:${i===focus?'var(--primary-tint)':''}" tabindex="${i===focus?0:-1}" data-i="${i}"><input type="checkbox" data-id="${r.id}" ${selected.has(r.id)?'checked':''}> ${r.title} <span class="age">${r.age}</span></div>`).join('');
  document.querySelectorAll('#list [data-i]').forEach(el=>el.onclick=e=>{if(e.target.matches('input')){const id=e.target.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);document.getElementById('bulk').classList.toggle('show',selected.size>0);return}focus=+el.dataset.i;render()});
  document.querySelectorAll('[data-bulk]').forEach(b=>b.onclick=()=>{NOTIFS.forEach(n=>{if(selected.has(n.id))n.unread=false});announce('bulk read');selected.clear();render()});
  document.getElementById('tabs').innerHTML=['log','delivery','broadcast','segment','send'].map(t=>`<button class="tab" data-tab="${t}" aria-selected="${t===opsTab}">${t}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{opsTab=b.dataset.tab;render()});
  document.getElementById('panel').innerHTML=opsHTML()+`<p class="mono" style="margin-top:8px">C7: ops primary · personal inbox demoted to rail · broadcasts still confirm-gated</p>`;
  const go=document.getElementById('go');if(go)go.onclick=()=>openConfirm(opsTab==='broadcast'?'broadcast':'send',(document.getElementById('t')||{}).value);
}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;const rows=pool();if(e.key==='j'){focus=Math.min(focus+1,rows.length-1);render()}if(e.key==='k'){focus=Math.max(focus-1,0);render()}});
render();

</script>

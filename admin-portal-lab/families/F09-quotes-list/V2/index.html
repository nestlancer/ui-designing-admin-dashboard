c:tabular-nums}.kpi span{font-size:11px;color:var(--muted-foreground)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left}tr[aria-selected="true"]{background:var(--primary-tint)}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const toast=document.getElementById('toast');function announce(m){toast.className='toast show';toast.textContent=m;clearTimeout(announce.t);announce.t=setTimeout(()=>toast.className='toast',2600)}

const QUOTES=[
{id:'q1',title:'AUDIT-P23-SUPP-20261005-6grw Request',amount:'₹1,250.00',client:'arjun.mehta@nestlancer.com',status:'Sent',age:'24d',stale:true},
{id:'q2',title:'Copy of AUDIT-P24-20261005-6y6fa-sent Request',amount:'₹2,832.00',client:'arjun.mehta@nestlancer.com',status:'Sent',age:'24d',stale:true},
{id:'q3',title:'AUDIT-P24-20261005-6y6fa-draft Request',amount:'₹2,832.00',client:'arjun.mehta@nestlancer.com',status:'Draft',age:'24d',stale:false,unassigned:true},
{id:'q4',title:'Copy of AUDIT-P24-20261005-6v89t-sent Request',amount:'₹2,832.00',client:'arjun.mehta@nestlancer.com',status:'Sent',age:'24d',stale:true},
{id:'q5',title:'AUDIT-P24-20261005-6v89t-draft Request',amount:'₹2,832.00',client:'arjun.mehta@nestlancer.com',status:'Draft',age:'24d',stale:false,unassigned:true},
{id:'q6',title:'AUDIT-P23-SUPP-20261005-bwrn Request',amount:'₹1,250.00',client:'arjun.mehta@nestlancer.com',status:'Viewed',age:'25d',stale:true,expiring:true},
{id:'q7',title:'AUDIT-P24-20261005-03ipf-draft Request',amount:'₹2,832.00',client:'arjun.mehta@nestlancer.com',status:'Draft',age:'25d',stale:false,unassigned:true},
{id:'q8',title:'AUDIT-P23-SUPP-20261005-8p13 Request',amount:'₹1,250.00',client:'arjun.mehta@nestlancer.com',status:'Pending send',age:'25d',stale:true},
{id:'q9',title:'Copy of AUDIT-P24-20261005-uc3d4-sent Request',amount:'₹2,832.00',client:'arjun.mehta@nestlancer.com',status:'Sent',age:'25d',stale:true,expiring:true},
{id:'q10',title:'AUDIT-P24-20261005-uc3d4-draft Request',amount:'₹2,832.00',client:'arjun.mehta@nestlancer.com',status:'Draft',age:'25d',stale:false,unassigned:true}
];
const STATUSES=['Draft','Pending send','Sent','Viewed','Changes requested','Accepted','Declined','Expired','All statuses'];
let filter='All statuses',view='all',focus=0,selected=new Set();
function pool(){let r=QUOTES.slice();
 if(filter!=='All statuses')r=r.filter(x=>x.status===filter);
 if(view==='stale')r=r.filter(x=>x.stale);
 if(view==='unassigned')r=r.filter(x=>x.unassigned);
 if(view==='expiring')r=r.filter(x=>x.expiring);
 return r}
function openF10(r){announce('Open F10 detail · '+r.title+' (demo deep-link /quotes/[id])')}
function nextAfter(r){announce('Opened · advance to next');focus=Math.min(focus+1,pool().length-1);render();const rows=pool();if(rows[focus])openF10(rows[focus])}

function render(){
 document.getElementById('chips').innerHTML=STATUSES.map(s=>`<button class="chip" data-f="${s}" aria-pressed="${s===filter}">${s}</button>`).join('');
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
 document.getElementById('views').innerHTML=[['all','All'],['stale','Stale-7d'],['unassigned','Unassigned'],['expiring','Expiring']].map(([id,l])=>`<button class="view" data-v="${id}" aria-pressed="${id===view}">${l}</button>`).join('');
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
 const rows=pool().slice().sort((a,b)=>parseInt(b.age)-parseInt(a.age));
 document.getElementById('list').innerHTML=rows.map((r,i)=>`<button type="button" class="row" role="option" tabindex="${i===focus?0:-1}" aria-selected="${i===focus}" data-i="${i}"><input type="checkbox" data-id="${r.id}" ${selected.has(r.id)?'checked':''}><div><span class="age">${r.age}${r.expiring?' · expiring':''}</span> <span class="st">${r.status}</span><div><strong>${r.title}</strong></div><div class="mono">${r.client}</div></div><div class="amt">${r.amount}</div></button>`).join('');
 document.querySelectorAll('.row').forEach(el=>el.onclick=e=>{if(e.target.matches('input')){const id=e.target.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);document.getElementById('bulk').classList.toggle('show',selected.size>0);document.getElementById('bulk-count').textContent=selected.size;return}focus=+el.dataset.i;nextAfter(rows[focus])});
 document.getElementById('page').textContent=`Showing 1–${rows.length} of ${rows.length} · age-ordered`;
 document.querySelectorAll('[data-bulk]').forEach(b=>b.onclick=()=>{announce(b.dataset.bulk);selected.clear();render()});
}
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;const rows=pool();if(e.key==='j'){focus=Math.min(focus+1,rows.length-1);render()}if(e.key==='k'){focus=Math.max(focus-1,0);render()}if(e.key==='Enter')nextAfter(pool()[focus]);if(e.key==='e'){focus=Math.min(focus+1,pool().length-1);render()}});
render();

</script>

<style>
body{min-height:100vh;background:var(--background);color:var(--foreground);font-family:var(--font)}.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--card)}.brand{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}.brand svg{width:28px;height:28px}.main{padding:18px;max-width:1180px;margin:0 auto}h1{margin:4px 0 6px;font-size:30px}.lede{margin:0 0 12px;color:var(--muted-foreground);font-size:14px;line-height:1.5}.mono{font-family:var(--mono);font-size:11px;color:var(--muted-foreground)}.lab-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:12px}.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);font-size:13px;display:none}.toast.show{display:block}.view,.statebtn{min-height:30px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--muted);font:650 12px var(--font);cursor:pointer;color:inherit;margin:0 4px 4px 0}.view[aria-pressed="true"],.statebtn[aria-pressed="true"]{background:var(--primary-tint);border-color:var(--brand-200);color:var(--brand-800)}.st{display:inline-flex;padding:2px 6px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid var(--status-info-border);background:var(--status-info-bg);color:var(--status-info-text)}.banner{padding:12px 14px;border:1px solid var(--status-warning-border);background:var(--status-warning-bg);color:var(--status-warning-text);border-radius:var(--radius-md);margin-bottom:12px}.banner.error{border-color:var(--status-warning-border);background:var(--status-warning-bg)}.kpi{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);min-width:100px;display:inline-block;margin:0 8px 8px 0}.kpi b{display:block;font:800 24px/1 var(--font);font-variant-numeric:tabular-nums}.kpi span{font-size:11px;color:var(--muted-foreground)}.skel{height:14px;background:linear-gradient(90deg,var(--muted),var(--border),var(--muted));background-size:200% 100%;border-radius:4px;margin:8px 0;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left}.demo{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground);border:1px dashed var(--border);padding:1px 5px;border-radius:4px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{padding:18px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--card);margin-bottom:12px}.hero h2{margin:0 0 6px;font-size:22px}
</style>
</head>
<body>

<div id="states"></div>
<div class="hero" id="hero"></div>
<div id="body"></div>

</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>(()=>{const b=document.querySelector('.theme-toggle'),r=document.documentElement,s=()=>{const d=r.classList.contains('dark');b.setAttribute('aria-pressed',String(d));b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode')};s();b.onclick=()=>{r.classList.toggle('dark');try{localStorage.setItem('nl-admin-theme',r.classList.contains('dark')?'dark':'light')}catch(e){}s()}})();</script>
<script>
const toast=document.getElementById('toast');function announce(m){toast.className='toast show';toast.textContent=m;clearTimeout(announce.t);announce.t=setTimeout(()=>toast.className='toast',2600)}

const ROWS=[
['AUDIT-P25-20261005-73dhk Project Fixture','Pending payment','arjun.mehta@nestlancer.com','Oct 6, 2026','01a11aaa…'],
['GPS Fleet Tracking Portal','In progress','rahul.desai@nestlancer.com','Oct 6, 2026','01a11bbb…'],
['Razorpay Settlement Reconciliation Engine','Revision requested','ananya.iyer@nestlancer.com','Oct 5, 2026','01a10a2c…'],
['Patel Digital Agency Website Redesign','Completed','samira.patel@nestlancer.com','Oct 5, 2026','01a10a2b…'],
['UPI Merchant Collections Mobile App','In progress','ananya.iyer@nestlancer.com','Oct 5, 2026','01a10ccc…'],
['Live Shipment Tracking Dashboard','Completed','rahul.desai@nestlancer.com','Oct 5, 2026','01a10ddd…'],
['AUDIT-P23 LINE delivery fixture','Pending payment','arjun.mehta@nestlancer.com','Oct 5, 2026','01a10eee…'],
['AUDIT-P24 draft converted','Completed','arjun.mehta@nestlancer.com','Oct 5, 2026','01a10fff…']
];
let state='degraded', focus=0, view='all';
const STATES=['loading','degraded','error','recovered','list'];
function stateBar(el){
  el.innerHTML=STATES.map(s=>`<button type="button" class="statebtn" data-st="${s}" aria-pressed="${s===state}">${s}</button>`).join('');
  el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{state=b.dataset.st;announce('State · '+state);render()});
}
function bannerHTML(){
  if(state==='loading') return `<div class="banner" role="status">Projects API request in flight… Finding #1: /api/v1/admin/projects* often never returns.</div>`;
  if(state==='degraded') return `<div class="banner" role="alert"><strong>A11 · Projects data unavailable</strong> — GET /api/v1/admin/projects* failed (net::ERR_FAILED). What still works: Requests, Quotes, Payments, ⌘K. <button type="button" class="button button-secondary" id="retry">Retry</button></div>`;
  if(state==='error') return `<div class="banner error" role="alert"><strong>Network Error</strong> — Projects service did not respond. Backend/edge defect, not operator error. <button type="button" class="button" id="retry">Retry</button></div>`;
  if(state==='recovered') return `<div class="banner" role="status" style="border-color:var(--brand-200);background:var(--primary-tint);color:var(--brand-800)"><strong>Recovered (demo fixture)</strong> — rows labelled demo from shot 052. Not live. <button type="button" class="button button-secondary" id="to-outage">Simulate outage</button></div>`;
  return `<div class="banner" role="status"><span class="demo">DEMO DATA</span> Intended list preview (screenshot 052). Live API remain exist-but-down.</div>`;
}
function listHTML(){
  if(state==='loading') return `<div style="padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--card)"><p class="mono">Loading…</p><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
  if(state==='degraded'||state==='error') return `<div style="padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--card)"><h2 style="margin:0 0 8px;font-size:18px">${state==='error'?'Network Error':'Projects unavailable'}</h2><p>The console cannot load projects until the API recovers.</p><ul class="mono"><li>Still works: Requests, Quotes, Inquiries, Payments</li><li>Blocked: Project list + detail (F12)</li></ul><button type="button" class="button" id="retry2">Retry</button> <button type="button" class="button button-secondary" id="preview">Preview intended UI (demo)</button></div>`;
  let rows=ROWS.slice();
  if(view==='pay') rows=rows.filter(r=>r[1]==='Pending payment');
  if(view==='rev') rows=rows.filter(r=>r[1]==='Revision requested');
  if(view==='needs') rows=rows.filter(r=>r[1]!=='Completed');
  return `<div class="kpi"><b>18</b><span>Total Projects</span></div><div class="kpi"><b>8</b><span>Active</span></div><div class="kpi"><b>10</b><span>Completed</span></div>
  <p><span class="demo">DEMO DATA</span></p>
  <div style="margin:8px 0"><button class="view" data-v="all" aria-pressed="${view==='all'}">All</button>
  <button class="view" data-v="needs" aria-pressed="${view==='needs'}">Needs me</button>
  <button class="view" data-v="pay" aria-pressed="${view==='pay'}">Pending payment</button>
  <button class="view" data-v="rev" aria-pressed="${view==='rev'}">Revision</button></div>
  <table><thead><tr><th></th><th>Title</th><th>Status</th><th>Client</th><th>Created</th><th>Actions</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr data-i="${i}" tabindex="${i===focus?0:-1}" aria-selected="${i===focus}"><td><input type="checkbox"></td><td>${r[0]} <span class="demo">demo</span><div class="mono">${r[4]}</div></td><td><span class="st">${r[1]}</span></td><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td><td><button type="button" class="button button-secondary" data-go="${i}">View →</button></td></tr>`).join('')}</tbody></table>
  <p class="mono">Showing 1–${rows.length} of 18 · 18 project records</p>`;
}
function wireCommon(){
  const r=()=>{announce('Retrying…');state='loading';render();setTimeout(()=>{state='error';announce('Retry failed · Network Error');render()},700)};
  const a=document.getElementById('retry');if(a)a.onclick=r;
  const b=document.getElementById('retry2');if(b)b.onclick=r;
  const p=document.getElementById('preview');if(p)p.onclick=()=>{state='list';render()};
  const o=document.getElementById('to-outage');if(o)o.onclick=()=>{state='degraded';render()};
  document.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{view=x.dataset.v;render()});
  document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>announce('Open F12 · '+ROWS[+x.dataset.go][0]+' (demo)'));
}

function render(){
  stateBar(document.getElementById('states'));
  const titles={loading:'Loading projects…',degraded:'Degraded · API down',error:'Network Error',recovered:'Recovered (demo)',list:'List preview (demo)'};
  document.getElementById('hero').innerHTML=`<h2>${titles[state]}</h2>${bannerHTML()}<p class="mono">Finding #1 · exist-but-down · A11</p>`;
  document.getElementById('body').innerHTML=(state==='list'||state==='recovered'||state==='loading')?listHTML():`<p class="mono">List docked until recovery or demo preview.</p><button type="button" class="button" id="preview">Preview intended UI (demo)</button>`;
  wireCommon();
}
render();

</script>
<script src="../../../shared/console-shell.js" defer></script>
